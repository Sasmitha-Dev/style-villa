<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed - Style Villa Bentota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @media print {
      .site-header, .site-footer, .no-print {
        display: none !important;
      }
      body {
        background: #fff;
      }
      .card {
        box-shadow: none;
        border: 1px solid #ccc;
      }
    }
  </style>
</head>
<body>
  <header class="site-header is-scrolled">
    <div class="container nav-wrapper">
      <a href="index.html" class="brand-logo">Style Villa</a>
      <a href="index.html" class="nav-link">&larr; Return to Home</a>
    </div>
  </header>

  <main class="container" style="max-width: 720px; margin: 6rem auto 5rem;">
    <div class="card" style="padding: 2.5rem; text-align: center;" id="confirmation-card">
      <div style="width: 54px; height: 54px; background: var(--success-subtle); color: var(--success); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem;">
        <svg width="28" height="28" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7" />
        </svg>
      </div>

      <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Reservation Confirmed</h1>
      <p style="color: var(--muted); font-size: 0.9375rem; margin-bottom: 1.5rem;">
        Thank you for choosing Style Villa. We look forward to welcoming you to Bentota!
      </p>

      <div style="background: var(--bg); border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 2rem;">
        <span style="font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em;">Booking Reference</span>
        <div id="booking-ref-display" style="font-size: 1.5rem; font-weight: 700; color: var(--primary); letter-spacing: 0.05em; margin-top: 0.25rem;">
          Loading...
        </div>
      </div>

      <!-- Detail Table -->
      <div id="booking-details-body" style="text-align: left; font-size: 0.9375rem; display: flex; flex-direction: column; gap: 0.75rem; border-top: 1px solid var(--border); padding-top: 1.5rem; margin-bottom: 2rem;">
        <p style="text-align: center; color: var(--muted);">Retrieving reservation details...</p>
      </div>

      <!-- Action buttons -->
      <div class="no-print" style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="btn btn-primary" id="btn-add-calendar">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          Add to Calendar (.ics)
        </button>
        <button type="button" class="btn btn-outline" id="btn-print-receipt">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
          Print Receipt
        </button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <p style="font-size: 0.875rem;">&copy; 2026 Style Villa. All Rights Reserved.</p>
    </div>
  </footer>

  <script type="module">
    import { api } from './js/api.js';
    import { formatCurrency, formatDate, generateIcs, showToast } from './js/utils.js';

    let currentBooking = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const reference = urlParams.get('ref');

      if (!reference) {
        document.getElementById('booking-details-body').innerHTML = `
          <p style="color: var(--danger); text-align: center;">No booking reference provided.</p>
        `;
        return;
      }

      try {
        const booking = await api.getBooking(reference);
        currentBooking = booking;

        document.getElementById('booking-ref-display').textContent = booking.reference;
        document.getElementById('booking-details-body').innerHTML = `
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--muted);">Room:</span>
            <strong>${booking.room.name}</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--muted);">Guest Name:</span>
            <span>${booking.guest.fullName}</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--muted);">Email:</span>
            <span>${booking.guest.email}</span>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--muted);">Check-in:</span>
            <strong>${formatDate(booking.checkIn)} (from 14:00)</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--muted);">Check-out:</span>
            <strong>${formatDate(booking.checkOut)} (until 11:00)</strong>
          </div>
          <div style="display: flex; justify-content: space-between;">
            <span style="color: var(--muted);">Duration:</span>
            <span>${booking.nights} nights (${booking.adults} Adults${booking.children ? `, ${booking.children} Children` : ''})</span>
          </div>
          <div style="display: flex; justify-content: space-between; border-top: 1px dashed var(--border); padding-top: 0.5rem; font-size: 1.15rem;">
            <span>Total Payable on Arrival:</span>
            <strong style="color: var(--primary);">${formatCurrency(booking.totalPrice, booking.currency)}</strong>
          </div>
          <div style="background: var(--primary-subtle); padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.8125rem; color: var(--primary-dark); margin-top: 0.5rem;">
            Location: Polwatta, Dedduwa, Haburugala, 80500 Bentota, Sri Lanka (3-minute walk from Lunuganga).
          </div>
        `;
      } catch (err) {
        document.getElementById('booking-details-body').innerHTML = `
          <p style="color: var(--danger); text-align: center;">${err.message}</p>
        `;
      }

      document.getElementById('btn-add-calendar')?.addEventListener('click', () => {
        if (currentBooking) {
          generateIcs(currentBooking);
        }
      });

      document.getElementById('btn-print-receipt')?.addEventListener('click', () => {
        window.print();
      });
    });
  </script>
</body>
</html>
